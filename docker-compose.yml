name: dica-web

services:
  web:
    image: ${APP_IMAGE:-dica-web:local}
    pull_policy: ${APP_PULL_POLICY:-missing}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>{if(!r.ok&&r.status!==307&&r.status!==308)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
