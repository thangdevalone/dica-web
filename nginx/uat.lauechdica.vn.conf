# =============================================================================
# Cấu hình Nginx cho domain: uat.lauechdica.vn
# File đặt tại server: /etc/nginx/sites-available/uat.lauechdica.vn
# Sau đó symlink sang: /etc/nginx/sites-enabled/uat.lauechdica.vn
# Hoặc đặt trực tiếp: /etc/nginx/conf.d/uat.lauechdica.vn.conf
# =============================================================================

# 1. Chuyển hướng toàn bộ HTTP (cổng 80) sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name uat.lauechdica.vn;

    # Xác thực Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server chính HTTPS (cổng 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uat.lauechdica.vn;

    # Đường dẫn SSL (Certbot sẽ tự động tạo khi chạy lệnh certbot)
    ssl_certificate /etc/letsencrypt/live/uat.lauechdica.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.lauechdica.vn/privkey.pem;

    # Giới hạn kích thước upload (khớp 10mb của backend)
    client_max_body_size 10m;

    # Bật nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Header bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Route: Backend API (/api/) -> Chuyển tiếp tới NestJS (cổng 3000)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Route: Next.js Static Cache (/_next/static/) -> Tăng tốc tải tài nguyên tĩnh
    # -------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Route: Frontend Web (/) -> Chuyển tiếp tới Next.js (cổng 3001)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
